<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login — Master Duty Pro</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:
    linear-gradient(
        135deg,
        #0f172a 0%,
        #0c4a4e 50%,
        #0f172a 100%
    );

    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
}

.glass{
    background:rgba(15,23,42,.75);
    backdrop-filter:blur(20px);
    border:1px solid rgba(45,212,191,.15);
}

</style>

</head>

<body class="flex items-center justify-center p-4">

<div class="w-full max-w-md">

    <!-- LOGO -->

    <div class="text-center mb-8">

        <div
        class="
        inline-flex
        items-center
        justify-center
        w-20
        h-20
        rounded-2xl
        bg-gradient-to-br
        from-teal-400
        to-teal-700
        mb-5
        ">

            <i
            class="
            fas
            fa-shield-halved
            text-3xl
            text-white
            "></i>

        </div>

        <h1
        class="
        text-3xl
        font-bold
        text-white
        ">
            Master Duty Pro
        </h1>

        <p
        class="
        text-teal-300
        mt-2
        text-sm
        ">
            Polis Bantuan FGV • Wilayah Terengganu
        </p>

    </div>

    <!-- LOGIN CARD -->

    <div class="glass rounded-3xl p-8">

        <div class="text-center mb-8">

            <h2 class="text-xl font-semibold text-white">
                Selamat Kembali
            </h2>

            <p class="text-slate-400 text-sm mt-1">
                Log masuk menggunakan No.SKB
            </p>

        </div>

        <form id="loginForm" class="space-y-5">

            <!-- NO SKB -->

            <div>

                <label
                class="
                block
                text-sm
                font-medium
                text-slate-300
                mb-2
                ">
                    No.SKB
                </label>

                <input
                type="text"
                id="noSkb"
                placeholder="Contoh: 12345"
                class="
                w-full
                bg-slate-900
                border
                border-slate-700
                text-white
                rounded-xl
                py-3.5
                px-4
                focus:outline-none
                focus:border-teal-500
                "
                required>

            </div>

            <!-- PASSWORD -->

            <div>

                <label
                class="
                block
                text-sm
                font-medium
                text-slate-300
                mb-2
                ">
                    Kata Laluan
                </label>

                <input
                type="password"
                id="password"
                placeholder="Masukkan Kata Laluan"
                class="
                w-full
                bg-slate-900
                border
                border-slate-700
                text-white
                rounded-xl
                py-3.5
                px-4
                focus:outline-none
                focus:border-teal-500
                "
                required>

            </div>

            <div
            id="errorMsg"
            class="
            hidden
            text-red-400
            text-sm
            text-center
            "></div>

            <button
            type="submit"
            id="btnLogin"
            class="
            w-full
            bg-teal-600
            hover:bg-teal-500
            text-white
            font-semibold
            py-3.5
            rounded-xl
            transition
            ">
                Log Masuk
            </button>

        </form>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://nlwrrrwkjpktrifxeymw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0ymP9thOFXkuNYzvwa0gwQ_1mbxyFE6";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const ADMIN_JAWATAN = [
    "PTW",
    "PPOW",
    "POW"
];

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    const noSkb =
    document
    .getElementById("noSkb")
    .value
    .trim();

    const password =
    document
    .getElementById("password")
    .value
    .trim();

    const errorMsg =
    document
    .getElementById("errorMsg");

    const btnLogin =
    document
    .getElementById("btnLogin");

    errorMsg.classList.add("hidden");

    btnLogin.disabled = true;
    btnLogin.textContent =
    "Sedang log masuk...";

    try{

        const { data, error } =
        await supabaseClient
        .from("data_login")
        .select("*")
        .eq("no_skb", noSkb)
        .maybeSingle();

        if(error){

            console.error(error);

            throw new Error(
                "Ralat sambungan database."
            );

        }

        if(!data){

            throw new Error(
                "No.SKB tidak dijumpai."
            );

        }

        if(
            String(data.password) !==
            String(password)
        ){

            throw new Error(
                "Kata laluan salah."
            );

        }

        const status =
        String(data.status || "")
        .trim()
        .toLowerCase();

        if(status !== "aktif"){

           throw new Error(
             "Akaun anda tidak aktif."
           );

        }

        const jawatan =
        String(data.jawatan || "")
        .trim()
        .toUpperCase();

        const isAdmin =
        ADMIN_JAWATAN.includes(jawatan);

        const isKetuaPos =
        jawatan.includes("KETUA POS");

        const isKetuaUnit =
        jawatan.includes("KETUA UNIT");

        const role =
        isAdmin
        ? "admin"
        : isKetuaUnit
        ? "ketua_unit"
        : isKetuaPos
        ? "ketua_pos"
        : "anggota";

        const userData = {

            noSkb:
            data.no_skb,

            wilayah:
            data.wilayah,

            kawasan:
            data.kawasan,

            pangkat:
            data.pangkat,

            noAnggota:
            data.no_anggota,

            name:
            data.nama_ketua,

            pos:
            data.pos,

            unit:
            data.unit,

            jawatan:
            data.jawatan,

            status:
            data.status,

            role:
            role,

            isAdmin:
            isAdmin,

            isKetuaPos:
            isKetuaPos,

            isKetuaUnit:
            isKetuaUnit

        };

        localStorage.setItem(
            "mdp_user",
            JSON.stringify(userData)
        );

        console.log(
            "LOGIN BERJAYA",
            userData
        );

        if(isAdmin){

            window.location.href =
            "dashboard.html";

        }else{

            window.location.href =
            "jadual-duty.html";

        }

    }
    catch(err){

        console.error(err);

        errorMsg.textContent =
        "❌ " +
        err.message;

        errorMsg.classList.remove(
            "hidden"
        );

        btnLogin.disabled =
        false;

        btnLogin.textContent =
        "Log Masuk";

    }

});

</script>

</body>
</html>
