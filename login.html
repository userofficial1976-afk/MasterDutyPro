  <script>


    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://nlwrrrwkjpktrifxeymw.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_0ymP9thOFXkuNYzvwa0gwQ_1mbxyFE6";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    // =====================================================
    // PASSWORD SEMENTARA
    // =====================================================

    const TEMP_PASSWORD = "123456";



    // =====================================================
    // JAWATAN ADMIN
    // =====================================================

    const ADMIN_JAWATAN = [

      "PTW",
      "PPOW",
      "POW"

    ];



    // =====================================================
    // FUNGSI SEMAK NILAI
    //
    // Digunakan untuk:
    // Ya
    // YA
    // yes
    // true
    // 1
    // aktif
    // ketua
    // =====================================================

    function isYes(value) {


      if (value === true) {

        return true;

      }


      if (
        value === false ||
        value === null ||
        value === undefined
      ) {

        return false;

      }


      const text =
        String(value)
          .trim()
          .toLowerCase();


      return [

        "ya",
        "yes",
        "true",
        "1",
        "ketua",
        "aktif"

      ].includes(text);

    }



    // =====================================================
    // SEMAK KETUA POS
    // =====================================================

    function checkKetuaPos(
      data,
      noSkb
    ) {


      const jawatan =
        String(data.jawatan || "")
          .trim()
          .toLowerCase();


      const ketuaPos =
        String(data.ketua_pos || "")
          .trim()
          .toLowerCase();


      const nama =
        String(data.nama || "")
          .trim()
          .toLowerCase();


      const skb =
        String(noSkb || "")
          .trim()
          .toLowerCase();



      // ---------------------------------------------------
      // 1. JAWATAN = KETUA POS
      // ---------------------------------------------------

      if (

        jawatan === "ketua pos" ||

        jawatan.includes("ketua pos")

      ) {

        return true;

      }



      // ---------------------------------------------------
      // 2. ketua_pos = YA / TRUE / 1
      // ---------------------------------------------------

      if (
        isYes(data.ketua_pos)
      ) {

        return true;

      }



      // ---------------------------------------------------
      // 3. ketua_pos SIMPAN NO.SKB
      // ---------------------------------------------------

      if (

        ketuaPos &&

        ketuaPos === skb

      ) {

        return true;

      }



      // ---------------------------------------------------
      // 4. ketua_pos SIMPAN NAMA
      // ---------------------------------------------------

      if (

        ketuaPos &&

        nama &&

        ketuaPos === nama

      ) {

        return true;

      }



      return false;

    }



    // =====================================================
    // SEMAK KETUA UNIT
    // =====================================================

    function checkKetuaUnit(
      data,
      noSkb
    ) {


      const jawatan =
        String(data.jawatan || "")
          .trim()
          .toLowerCase();


      const ketuaUnit =
        String(data.ketua_unit || "")
          .trim()
          .toLowerCase();


      const nama =
        String(data.nama || "")
          .trim()
          .toLowerCase();


      const skb =
        String(noSkb || "")
          .trim()
          .toLowerCase();



      // ---------------------------------------------------
      // 1. JAWATAN = KETUA UNIT
      // ---------------------------------------------------

      if (

        jawatan === "ketua unit" ||

        jawatan.includes("ketua unit")

      ) {

        return true;

      }



      // ---------------------------------------------------
      // 2. ketua_unit = YA / TRUE / 1
      // ---------------------------------------------------

      if (
        isYes(data.ketua_unit)
      ) {

        return true;

      }



      // ---------------------------------------------------
      // 3. ketua_unit SIMPAN NO.SKB
      // ---------------------------------------------------

      if (

        ketuaUnit &&

        ketuaUnit === skb

      ) {

        return true;

      }



      // ---------------------------------------------------
      // 4. ketua_unit SIMPAN NAMA
      // ---------------------------------------------------

      if (

        ketuaUnit &&

        nama &&

        ketuaUnit === nama

      ) {

        return true;

      }



      return false;

    }



    // =====================================================
    // FORM LOGIN
    // =====================================================

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();



          // =================================================
          // AMBIL INPUT
          // =================================================

          const noSkb =

            document
              .getElementById("noSkb")
              .value
              .trim();


          const password =

            document
              .getElementById("password")
              .value;


          const errorMsg =

            document
              .getElementById("errorMsg");


          const btnLogin =

            document
              .getElementById("btnLogin");



          // =================================================
          // RESET ERROR
          // =================================================

          errorMsg.classList.add(
            "hidden"
          );


          btnLogin.disabled = true;


          btnLogin.textContent =
            "Sedang log masuk...";



          try {


            // =================================================
            // 1. SEMAK PASSWORD
            // =================================================

            if (
              password !== TEMP_PASSWORD
            ) {

              throw new Error(
                "No.SKB atau Kata Laluan salah."
              );

            }



            // =================================================
            // 2. CARI DATA ANGGOTA
            // =================================================

            const {
              data,
              error
            } = await supabaseClient

              .from("Data_Anggota")

              .select(`
                no_skb,
                nama,
                unit,
                pos,
                jawatan,
                ketua_unit,
                ketua_pos,
                status
              `)

              .eq(
                "no_skb",
                noSkb
              )

              .maybeSingle();



            // =================================================
            // 3. ERROR SUPABASE
            // =================================================

            if (error) {

              console.error(
                "SUPABASE ERROR:",
                error
              );

              throw new Error(
                "Ralat sambungan ke database."
              );

            }



            // =================================================
            // 4. NO SKB TIDAK DIJUMPAI
            // =================================================

            if (!data) {

              throw new Error(
                "No.SKB tidak dijumpai dalam sistem."
              );

            }



            // =================================================
            // 5. SEMAK STATUS
            // =================================================

            const status =

              String(
                data.status || ""
              )
              .trim()
              .toLowerCase();



            if (

              status &&

              [

                "tidak aktif",
                "inactive",
                "disabled",
                "terminated",
                "keluar"

              ].includes(status)

            ) {

              throw new Error(
                "Akaun anda tidak aktif. Sila hubungi Admin."
              );

            }



            // =================================================
            // 6. SEMAK ADMIN
            // =================================================

            const jawatan =

              String(
                data.jawatan || ""
              )
              .trim()
              .toUpperCase();



            const isAdmin =

              ADMIN_JAWATAN.includes(
                jawatan
              );



            // =================================================
            // 7. SEMAK KETUA POS
            // =================================================

            const isKetuaPos =

              checkKetuaPos(
                data,
                noSkb
              );



            // =================================================
            // 8. SEMAK KETUA UNIT
            // =================================================

            const isKetuaUnit =

              checkKetuaUnit(
                data,
                noSkb
              );



            // =================================================
            // 9. HANYA ADMIN / KETUA POS / KETUA UNIT
            // =================================================

            if (

              !isAdmin &&

              !isKetuaPos &&

              !isKetuaUnit

            ) {

              throw new Error(
                "Akses ditolak. Hanya Admin, Ketua Pos dan Ketua Unit dibenarkan untuk log masuk."
              );

            }



            // =================================================
            // 10. TENTUKAN ROLE
            // =================================================

            let role =
              "anggota";



            if (isAdmin) {

              role =
                "admin";

            }

            else if (isKetuaUnit) {

              role =
                "ketua_unit";

            }

            else if (isKetuaPos) {

              role =
                "ketua_pos";

            }



            // =================================================
            // 11. BINA DATA USER
            // =================================================

            const userData = {

              noSkb:
                String(data.no_skb),

              name:
                data.nama || "",

              jawatan:
                data.jawatan || "",

              unit:
                data.unit || "",

              pos:
                data.pos || "",

              ketua_unit:
                data.ketua_unit || "",

              ketua_pos:
                data.ketua_pos || "",

              status:
                data.status || "",

              isAdmin:
                isAdmin,

              isKetuaPos:
                isKetuaPos,

              isKetuaUnit:
                isKetuaUnit,

              role:
                role

            };



            // =================================================
            // 12. SIMPAN LOGIN
            // =================================================

            localStorage.setItem(
              "mdp_user",
              JSON.stringify(userData)
            );



            // =================================================
            // 13. DEBUG CONSOLE
            // =================================================

            console.log(
              "================================="
            );

            console.log(
              "LOGIN BERJAYA"
            );

            console.log(
              "NO SKB:",
              userData.noSkb
            );

            console.log(
              "NAMA:",
              userData.name
            );

            console.log(
              "JAWATAN:",
              userData.jawatan
            );

            console.log(
              "ROLE:",
              userData.role
            );

            console.log(
              "ADMIN:",
              userData.isAdmin
            );

            console.log(
              "KETUA UNIT:",
              userData.isKetuaUnit
            );

            console.log(
              "KETUA POS:",
              userData.isKetuaPos
            );

            console.log(
              "=================================");



            // =================================================
            // 14. REDIRECT
            // =================================================

            // ADMIN
            if (isAdmin) {

              window.location.href =
                "dashboard.html";

            }


            // KETUA UNIT
            else if (isKetuaUnit) {

              window.location.href =
                "jadual-duty.html";

            }


            // KETUA POS
            else if (isKetuaPos) {

              window.location.href =
                "jadual-duty.html";

            }


          }


          // ===================================================
          // ERROR
          // ===================================================

          catch (err) {


            console.error(
              "LOGIN ERROR:",
              err
            );


            errorMsg.textContent =
              "❌ " +
              (
                err.message ||
                "Ralat semasa log masuk."
              );


            errorMsg.classList.remove(
              "hidden"
            );


            btnLogin.disabled =
              false;


            btnLogin.textContent =
              "Log Masuk";

          }

        }
      );


  </script>
